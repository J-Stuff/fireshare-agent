[project]
name = "fireshare-agent"
version = "1.4.0"
description = "Windows tray app that uploads NVIDIA ShadowPlay clips & screenshots to a Fireshare instance"
requires-python = ">=3.11"
license = { file = "LICENSE" }

[tool.semantic_release]
version_variables = ["fireshare_agent/__init__.py:__version__"]
version_toml = ["pyproject.toml:project.version"]
commit_parser = "conventional"

[tool.semantic_release.branches.main]
match = "(main)"
prerelease = false
