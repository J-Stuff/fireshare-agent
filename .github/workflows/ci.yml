name: CI

on:
  push:
  pull_request:
    branches: [main]

jobs:
  test:
    # pywin32 and Tkinter/CustomTkinter windows require a real Windows desktop session - GitHub's
    # windows-latest runners provide one, unlike Linux runners which would need Xvfb and still
    # couldn't import pywin32 at all.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest tests -v
